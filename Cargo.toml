[package]
name = "irondom"
version = "0.1.0"
edition = "2021"
authors = ["godofdream"]
description = "Minimalistic, featureful Home Assistant alternative. API-first, responsive, low-memory."
license = "MIT"
repository = "https://github.com/godofdream/irondom"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
futures = "0.3"
include_dir = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "irondom"
path = "src/main.rs"
